# fitnet-project/docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fitnet-postgres
    environment:
      POSTGRES_USER: fitnet_user
      POSTGRES_PASSWORD: fitnet_password
      POSTGRES_DB: fitnet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fitnet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: fitnet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fitnet_user
      RABBITMQ_DEFAULT_PASS: fitnet_password
    ports:
      - "5672:5672"   # Puerto AMQP
      - "15672:15672" # Puerto UI de gestión
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: